name: CI

# Pull requests run a fast gate only: lint, type-check, the tests related to
# the changed files (`vitest --changed`) and every file-reading guard test,
# as parallel jobs.
# Everything slow runs after the merge, on main: the full sharded test suite,
# the three `next build`s and the storefront bundle budget. A broken build
# never reaches production anyway: Vercel builds every deploy and keeps serving
# the last good one if a build fails.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are stale; main runs are never cancelled so a failed
  # build can't be hidden by the next merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads the code. A read-only token means a compromised dependency
# or action running in CI cannot push to the repo or edit releases.
permissions:
  contents: read

env:
  TURBO_CACHE_DIR: .turbo
  # The platform type-check needs more than Node's default ~4 GB heap and was
  # dying out of memory; runners have 16 GB.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  pr:
    name: ${{ matrix.name }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: type-check platform, task: type-check, args: "--filter=@scheniders/platform" }
          - { name: type-check rest, task: type-check, args: "--filter=!@scheniders/platform" }
          - { name: tests for changed files (platform 1/3), task: test, args: "--filter=@scheniders/platform -- --changed=${{ github.event.pull_request.base.sha }} --shard=1/3 --passWithNoTests" }
          - { name: tests for changed files (platform 2/3), task: test, args: "--filter=@scheniders/platform -- --changed=${{ github.event.pull_request.base.sha }} --shard=2/3 --passWithNoTests" }
          - { name: tests for changed files (platform 3/3), task: test, args: "--filter=@scheniders/platform -- --changed=${{ github.event.pull_request.base.sha }} --shard=3/3 --passWithNoTests" }
          - { name: tests for changed files (rest), task: test, args: "--filter=!@scheniders/platform -- --changed=${{ github.event.pull_request.base.sha }} --passWithNoTests" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ matrix.task }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.task }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo ${{ matrix.task }} --affected ${{ matrix.args }}

  guards:
    name: guard tests (always)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `vitest --changed` follows imports, so a test that reads the files it
      # polices with fs (server actions guarded, unique migration versions,
      # select guards, *-migration checks) never runs when only those files
      # change. Run every such test on every PR: they take seconds, and main
      # deploys on merge, so the post-merge run is too late to stop a bad one.
      - name: Platform file-reading guard tests
        working-directory: apps/platform
        run: |
          set -euo pipefail
          files=$(grep -rlE "readFileSync|readdirSync|readFile\(" --include=*.test.ts --include=*.test.tsx --exclude-dir=node_modules --exclude-dir=.next .)
          echo "$files"
          echo "$files" | xargs pnpm exec vitest run

  lint:
    name: lint changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The ESLint configs are not type-aware, so each file lints the same on
      # its own as in a full run. Only files this PR changed are linted; a
      # change to an app's ESLint config lints the whole app. The full lint
      # still runs on main after the merge.
      - name: ESLint changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          for app in platform storefront admin; do
            changed=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- "apps/$app")
            [ -z "$changed" ] && continue
            cd "apps/$app"
            if echo "$changed" | grep -q "^apps/$app/eslint.config"; then
              pnpm exec eslint
            else
              files=$(echo "$changed" | grep -E '\.(ts|tsx|js|jsx|mjs)$' | sed "s#^apps/$app/##" || true)
              [ -n "$files" ] && echo "$files" | xargs pnpm exec eslint
            fi
            cd ../..
          done

  check:
    name: ${{ matrix.name }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The platform app is most of the code, so each task is split into
        # "platform" and "everything else", and its tests into 4 shards.
        # Each entry is a full turbo command; `--affected` still decides
        # whether anything runs at all.
        include:
          - { name: lint platform, task: lint, args: "--filter=@scheniders/platform" }
          - { name: lint rest, task: lint, args: "--filter=!@scheniders/platform" }
          - { name: type-check platform, task: type-check, args: "--filter=@scheniders/platform" }
          - { name: type-check rest, task: type-check, args: "--filter=!@scheniders/platform" }
          - { name: test platform 1/4, task: test, args: "--filter=@scheniders/platform -- --shard=1/4" }
          - { name: test platform 2/4, task: test, args: "--filter=@scheniders/platform -- --shard=2/4" }
          - { name: test platform 3/4, task: test, args: "--filter=@scheniders/platform -- --shard=3/4" }
          - { name: test platform 4/4, task: test, args: "--filter=@scheniders/platform -- --shard=4/4" }
          - { name: test rest, task: test, args: "--filter=!@scheniders/platform" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # `--affected` diffs against the PR base (or the commit before a
          # push) and needs history; without it turbo runs everything.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ matrix.task }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.task }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo ${{ matrix.task }} --affected ${{ matrix.args }}

  build:
    name: build + bundle budget
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .turbo
            apps/*/.next/cache
          key: build-${{ github.sha }}
          restore-keys: build-

      - run: pnpm install --frozen-lockfile

      # `bundle-budget` is the storefront's shared-runtime JS budget; turbo
      # runs it after the storefront build, only when that build ran.
      - run: pnpm exec turbo build bundle-budget --affected
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
