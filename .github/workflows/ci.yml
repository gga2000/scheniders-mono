name: CI

# Pull requests run the fast gates (lint, type-check, test) as parallel jobs.
# The slow gate (three `next build`s + the storefront bundle budget) runs after
# the merge, on main. A broken build never reaches production anyway: Vercel
# builds every deploy and keeps serving the last good one if a build fails.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are stale; main runs are never cancelled so a failed
  # build can't be hidden by the next merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_CACHE_DIR: .turbo

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
        with:
          # `--affected` diffs against the PR base (or the commit before a
          # push) and needs history; without it turbo runs everything.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ matrix.task }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.task }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo ${{ matrix.task }} --affected

  build:
    name: build + bundle budget
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/*/.next/cache
          key: build-${{ github.sha }}
          restore-keys: build-

      - run: pnpm install --frozen-lockfile

      # `bundle-budget` is the storefront's shared-runtime JS budget; turbo
      # runs it after the storefront build, only when that build ran.
      - run: pnpm exec turbo build bundle-budget --affected
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
